name: check
on:
  push:
    paths: ['app/**', '.nvmrc', '.github/workflows/check.yml']
  pull_request:
    paths: ['app/**', '.nvmrc', '.github/workflows/check.yml']
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          if git diff --quiet "$base" "$HEAD_SHA" -- app .nvmrc ':(exclude)app/AGENTS.md' ':(exclude)app/CLAUDE.md'; then
            echo 'app=false' >> "$GITHUB_OUTPUT"
          else
            echo 'app=true' >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dex
          POSTGRES_PASSWORD: dex
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dex -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dex:dex@localhost:5432/dex_check_ci
      DATABASE_URL_UNPOOLED: postgresql://dex:dex@localhost:5432/dex_check_ci
      ANTHROPIC_API_KEY: check-only
      ANTHROPIC_BASE_URL: http://127.0.0.1:9
      RESEND_API_KEY: check-only
      RESEND_BASE_URL: http://127.0.0.1:9
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:3002
      WEBAUTHN_SECRET: check-only-secret-with-at-least-32-characters
      PHOTO_DIR: /tmp/dex-check-photos
      VERCEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:check:setup
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm run check
      - run: npm run test:browser
