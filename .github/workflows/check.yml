# Application gates run for application changes; instruction-only changes use harness.yml.
name: check
on:
  push:
    paths: ['app/**', '.nvmrc', '.github/workflows/check.yml']
  pull_request:
    paths: ['app/**', '.nvmrc', '.github/workflows/check.yml']
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          if git diff --quiet "$base" "$HEAD_SHA" -- app .nvmrc ':(exclude)app/AGENTS.md' ':(exclude)app/CLAUDE.md'; then
            echo 'app=false' >> "$GITHUB_OUTPUT"
          else
            echo 'app=true' >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
