<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standkreis · Product family</title>
<style>
@font-face{font-family:Titillium;src:url('../../app/src/styles/fonts/TitilliumWeb-Regular.woff2');font-weight:400;font-display:swap}@font-face{font-family:Titillium;src:url('../../app/src/styles/fonts/TitilliumWeb-SemiBold.woff2');font-weight:600;font-display:swap}*{box-sizing:border-box}body{margin:0;padding:40px;background:#f5f2ea;color:#1e2a23;font:17px/1.5 Titillium,sans-serif}header,main,footer{max-width:1160px;margin:auto}header{margin-bottom:30px;display:flex;align-items:end;justify-content:space-between;gap:24px}h1{font-size:34px;line-height:1.2;margin:0;font-weight:600}header p{margin:10px 0 0;color:#5b675f}button{font:600 16px Titillium;border:1px solid #9aa39d;border-radius:12px;background:transparent;color:inherit;cursor:pointer;padding:10px 18px;white-space:nowrap}button:focus-visible{outline:3px solid #2563eb;outline-offset:3px}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.column{min-width:0}h2{font-size:21px;font-weight:600;margin:0 0 6px}.note{font-size:15px;color:#5b675f;margin:0 0 24px;min-height:46px}.panel{border-radius:24px;background:#fff;padding:10px 24px;box-shadow:0 4px 30px #1e2a2306}.lockup{display:flex;align-items:center;gap:12px;min-height:112px;border-bottom:1px solid #1e2a230d;font-size:26px;white-space:nowrap}.lockup:last-child{border:0}.lockup img{width:36px;height:36px;flex:none}.org{font-weight:600;letter-spacing:-.5px}.product{font-weight:400;margin-left:6px}.stack{display:flex;flex-direction:column;gap:4px;line-height:1.15}.stack .product{font-size:19px;margin:0;color:var(--muted,#5b675f)}.dot{width:4px;height:4px;background:currentColor;border-radius:50%;flex:none;opacity:.65}.dot+.product{margin-left:0}.dotmark{gap:10px}.small{margin-top:24px;padding:18px 24px;background:#e7e2d6;border-radius:18px;font-size:18px;display:flex;align-items:center;gap:10px}.small img{width:28px;height:28px}.small .product{margin-left:3px}.small .stack .product{font-size:15px}.small .dot{width:3px;height:3px}.context{margin-top:32px;background:linear-gradient(90deg,#1e2a23eb,#1e2a2390),url('../../app/public/splash-720.jpg') center 60%/cover;border-radius:24px;padding:30px;color:white;display:flex;align-items:center;justify-content:space-between;gap:30px}.context h2{font-size:28px;max-width:360px;line-height:1.2;margin:0}.context .lockup{min-height:0;border:0}.context img{filter:brightness(0) invert(1)}footer{margin-top:24px;color:#5b675f;font-size:15px}body.dark{background:#121b16;color:#e9eee8;--muted:#a3aea6}.dark .panel{background:#1b2621}.dark .small{background:#243129}.dark .lockup{border-color:#ffffff10}.dark img{filter:brightness(0) invert(1)}.dark .note,.dark header p,.dark footer{color:#a3aea6}@media(max-width:1050px){body{padding:24px 16px}header{display:block}button{margin-top:20px}.columns{grid-template-columns:1fr;max-width:440px;margin:auto}.column{margin-bottom:25px}.note{min-height:0;margin-bottom:15px}.context{display:block;max-width:440px;margin:auto}.context h2{margin-top:25px}.lockup{font-size:28px}header,footer{max-width:440px}}
.org + .product{margin-left:-3px}.small > .org + .product{margin-left:-3.5px}
</style>
<header><div><h1>One organisation. Four products.</h1><p>Titillium Web, with three ways to give each product its place.</p></div><button id="theme" aria-pressed="false">Dark background</button></header>
<main><div class="columns" id="columns"></div><div class="context"><div class="lockup"><img src="../../app/public/brand/standkreis-mark.svg" alt=""><span class="org">Standkreis</span><span class="product">Atlas</span></div><h2>Entdecke, was um dich herum lebt.</h2></div></main>
<footer>Selected: space + weight, with a tighter gap. The organisation stays recognisable; each product gets its own name without another symbol.</footer>
<script>
const products=['Atlas','Species','Globe','Grow'];
const mark='<img src="../../app/public/brand/standkreis-mark.svg" alt="">';
function lock(name,variant){return variant==='stack'?mark+'<span class="stack"><span class="org">Standkreis</span><span class="product">'+name+'</span></span>':mark+'<span class="org">Standkreis</span>'+(variant==='dot'?'<span class="dot" aria-hidden="true"></span>':'')+'<span class="product">'+name+'</span>'}
document.getElementById('columns').innerHTML=[['space','1 · Space + weight','Selected · tighter spacing.'],['stack','2 · Stacked','A clear organisation → product hierarchy.'],['dot','3 · Small dot','A softer separator that echoes the mark.']].map(([id,title,note])=>'<section class="column"><h2>'+title+'</h2><p class="note">'+note+'</p><div class="panel">'+products.map(name=>'<div class="lockup '+(id==='dot'?'dotmark':'')+'" aria-label="Standkreis '+name+'">'+lock(name,id)+'</div>').join('')+'</div><div class="small" aria-label="Standkreis Atlas at app size">'+lock('Atlas',id)+'</div></section>').join('');
document.getElementById('theme').onclick=function(){const on=document.body.classList.toggle('dark');this.setAttribute('aria-pressed',String(on));this.textContent=on?'Light background':'Dark background'};
</script></html>
